[package]
name = "ez-suite"
version = "2.0.0"
description = "EZ Suite: EZ Soundboard + EZ Reticle in one lightweight app"
authors = ["EZGGco"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ez_suite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
regex = "1"
ureq = { version = "2.12", features = ["json"] }
url = "2"
tiny_http = "0.12"
# Audio: WASAPI output/input, decoding, noise suppression
cpal = "=0.15.3"
symphonia = { version = "0.5.4", default-features = false, features = ["mp3", "wav", "pcm", "flac", "vorbis", "ogg", "isomp4", "aac", "mkv", "adpcm"] }
nnnoiseless = { version = "0.5", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_ProcessStatus",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true
